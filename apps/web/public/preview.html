<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinOrch Preview</title>
  </head>
  <body>
    <script>
      const page = new URLSearchParams(window.location.search).get("page");
      const dialog = new URLSearchParams(window.location.search).get("dialog");
      sessionStorage.setItem("finorch.demo.entered.v1", "1");
      if (dialog) sessionStorage.setItem("finorch.preview.dialog", dialog);
      window.location.replace(
        "/#/" + (page && /^[a-z]+$/.test(page) ? page : "overview"),
      );
    </script>
  </body>
</html>
