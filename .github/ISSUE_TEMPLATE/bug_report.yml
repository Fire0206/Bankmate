name: Bug report
description: Report a reproducible defect in the private development project.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, personal information, or real financial data. Report security vulnerabilities privately using SECURITY.md."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic data and include the smallest reproducible steps.
      placeholder: "1. ..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and relevant runtime versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove tokens, identifiers, and private user data before attaching.
    validations:
      required: false
