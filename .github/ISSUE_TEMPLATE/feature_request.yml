name: Feature request
description: Propose a scoped product or engineering improvement.
title: "feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "FinOrch is currently in Phase 0. Proposals should respect the planned scope, simulated-data boundary, and published contracts."
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who needs this and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe a small, reviewable outcome.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend and UX
        - Banking backend and data
        - Agent and tool orchestration
        - Security, testing, and integration
        - Documentation and engineering
    validations:
      required: true
  - type: textarea
    id: contracts
    attributes:
      label: Contract, safety, and data impact
      description: Mention affected API, Tool, Workflow, Data, authorization, or audit contracts.
    validations:
      required: false
